databases:
  - name: sahakar-connect-db
    plan: free

services:
  - type: web
    name: sahakar-connect-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sahakar-connect-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
